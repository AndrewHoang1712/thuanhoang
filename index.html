<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data khách hàng Thuận</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#00B386">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Data KH Thuận">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{margin:0;height:100%;background:#00B386;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#F3F5F9}
  #cho{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
       background:linear-gradient(140deg,#00B386 0%,#00A3C4 55%,#FF7A45 120%);color:#fff;text-align:center;padding:24px;transition:opacity .35s}
  #cho.an{opacity:0;pointer-events:none}
  #cho b{font-size:20px;font-weight:800;letter-spacing:.03em;padding-bottom:12px;border-bottom:3px solid #FFE14D}
  .thanh{width:220px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;position:relative;margin-top:6px}
  .thanh i{position:absolute;top:0;bottom:0;width:40%;border-radius:3px;background:linear-gradient(90deg,#FFE14D,#FF7A45);animation:x 1.1s ease-in-out infinite}
  @keyframes x{0%{left:-40%}100%{left:100%}}
  .chu{font-size:15px;font-weight:600}
  #cham{display:none;font-size:14px;max-width:320px;line-height:1.5;opacity:.9}
  #cham a{color:#fff;font-weight:600}
</style>
</head>
<body>
<div id="cho">
  <b>DATA KHÁCH HÀNG THUẬN</b>
  <div class="thanh" aria-label="Đang tải"><i></i></div>
  <div class="chu">Đang tải dữ liệu…</div>
  <p id="cham">Tải hơi lâu? <a id="moThang" href="#" target="_top">Mở trực tiếp bằng link Google</a></p>
</div>
<iframe id="app" title="Data khách hàng Thuận"
  allow="clipboard-read; clipboard-write; fullscreen"
  referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
  /* Link Apps Script: khi triển khai "Phiên bản mới" thì link giữ nguyên, không cần sửa file này */
  var LINK = 'https://script.google.com/macros/s/AKfycbxzk9G5NNhGE_wQJTuqeIosELf4HsCgYLn9UG2LlKBq6nh5W2ior-30zP9uADld5x7F/exec';
  var f = document.getElementById('app'), cho = document.getElementById('cho');
  document.getElementById('moThang').href = LINK;
  f.addEventListener('load', function () { setTimeout(function () { cho.classList.add('an'); }, 400); });
  setTimeout(function () { document.getElementById('cham').style.display = 'block'; }, 8000);
  f.src = LINK;
</script>
</body>
</html>
